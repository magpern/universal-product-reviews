name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  m0-checks:
    name: M0 lint and policy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install Composer autoload
        run: composer install --no-interaction --prefer-dist

      - name: Run CI checks
        run: bash scripts/ci/check.sh
