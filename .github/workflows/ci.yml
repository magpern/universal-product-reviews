name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-policy:
    name: M1 lint and policy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: bash scripts/ci/check.sh

  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer test:unit

  integration-dev:
    name: Integration (DEV stack PHP 8.4 / WC 11.0.1)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      WP_DB_HOST: 127.0.0.1
      WP_DB_NAME: wordpress_test
      WP_DB_USER: root
      WP_DB_PASS: root
      WC_VERSION: '11.0.1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: bash tests/bin/install-wp.sh
      - run: composer test:integration

  integration-floor:
    name: Integration floor (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      mysql:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      WP_DB_HOST: 127.0.0.1
      WP_DB_NAME: wordpress_test
      WP_DB_USER: root
      WP_DB_PASS: root
      WC_VERSION: '8.2.0'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli
          coverage: none
      - run: composer require --dev wp-phpunit/wp-phpunit:^6.5 --no-interaction --prefer-dist
      - run: composer install --no-interaction --prefer-dist
      - run: bash tests/bin/install-wp.sh
      - run: composer test:integration
