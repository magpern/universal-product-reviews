# Builds the deterministic UPR package from the release tag and uploads it to the
# private update server.
#
# Repo secrets: WPUS_URL (<server>/push.php), WPUS_TOKEN (bearer token).
# Repo variable (optional): PLUGIN_SLUG (defaults to the repo name).

name: Publish release package

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer

      - name: Resolve slug and version
        id: meta
        run: |
          slug="${{ vars.PLUGIN_SLUG }}"
          [ -n "$slug" ] || slug="${GITHUB_REPOSITORY#*/}"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build package from the release tag
        id: build
        run: |
          bash scripts/build-release-package.sh "${GITHUB_REF_NAME}"
          zip="builds/universal-product-reviews-${{ steps.meta.outputs.version }}.zip"
          [ -s "$zip" ] || { echo "::error::missing $zip"; ls -la builds || true; exit 1; }
          echo "path=$zip" >> "$GITHUB_OUTPUT"

      - name: Upload to update server
        run: |
          curl --fail-with-body -sS \
            -H "Authorization: Bearer ${{ secrets.WPUS_TOKEN }}" \
            -F "package=@${{ steps.build.outputs.path }}" \
            "${{ secrets.WPUS_URL }}?slug=${{ steps.meta.outputs.slug }}"

      - name: Verify it is live
        env:
          WPUS_URL: ${{ secrets.WPUS_URL }}
          SLUG: ${{ steps.meta.outputs.slug }}
        run: |
          base="${WPUS_URL%/push.php}"
          curl -sS "$base/?action=get_metadata&slug=$SLUG" | tee /dev/stderr | grep -q '"version"'
